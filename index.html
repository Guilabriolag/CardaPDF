<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder Pro - Labriolag</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --accent: #f7931a; --bg: #0f0f12; --card: #1c1c21; --primary: #e31c1c; }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Otimizada */
        #editor { width: 420px; background: #000; display: flex; flex-direction: column; border-right: 1px solid #222; }
        .tabs { display: flex; background: #111; border-bottom: 1px solid #222; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #666; cursor: pointer; font-weight: bold; font-size: 12px; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: #1a1a1a; }

        .content-area { flex: 1; padding: 20px; overflow-y: auto; }
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; background: #1c1c21; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: var(--accent); outline: none; }

        /* Item Row */
        .item-row { display: flex; gap: 8px; margin-bottom: 10px; background: #16161a; padding: 8px; border-radius: 6px; }
        .btn-del { background: none; border: none; color: #ff4444; cursor: pointer; padding: 0 10px; }

        /* Preview (iPhone) */
        #preview { flex: 1; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .mockup { width: 310px; height: 630px; border: 12px solid #222; border-radius: 45px; background: #fff; overflow: hidden; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

        /* Footer do Builder */
        .builder-footer { padding: 20px; background: #111; border-top: 1px solid #222; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        .btn-main:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1c1c21; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="editor">
    <div style="padding: 20px; border-bottom: 1px solid #222;">
        <h2 style="margin:0; color:var(--accent); font-size: 18px;">Labrio Dashboard</h2>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('geral')">LOJA</button>
        <button class="tab-btn" onclick="switchTab('cardapio')">PRODUTOS</button>
        <button class="tab-btn" onclick="switchTab('taxas')">TAXAS</button>
    </div>

    <div class="content-area" id="tab-geral">
        <div class="field-group">
            <label>Nome Comercial</label>
            <input type="text" id="nome" value="Vitorelli Alphaville" oninput="sync()">
        </div>
        <div class="field-group">
            <label>Link do WhatsApp</label>
            <input type="text" id="whats" value="551199999999" oninput="sync()">
        </div>
    </div>

    <div class="content-area" id="tab-cardapio" style="display:none">
        <div id="item-container"></div>
        <button onclick="addItem()" class="btn-main" style="background:#222; font-size: 12px; margin-top:10px;">+ Novo Sabor</button>
    </div>

    <div class="builder-footer">
        <button class="btn-main" onclick="openCheckout()">📥 Publicar e Baixar</button>
    </div>
</div>

<div id="preview">
    <div class="mockup" id="phone-screen"></div>
</div>

<div id="modal-pay" class="modal">
    <div class="modal-box">
        <h3>Finalizar Projeto 🚀</h3>
        <p style="color:#888; font-size: 14px;">Escolha o método de liberação:</p>
        <a href="https://mpago.la/2UwE4uj" target="_blank" class="btn-main" style="display:block; text-decoration:none; background:#009ee3; margin-bottom:12px; color:#fff" onclick="notify('PIX/CC')">R$ 39,90 via Mercado Pago</a>
        <button class="btn-main" onclick="notify('Lightning'); processDownload()">10 Sats via Lightning</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">Continuar editando</button>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('labrio_data')) || {
        nome: "Vitorelli Pizzaria",
        whats: "551199999999",
        itens: [{sabor: "Calabresa", preco: "45.00"}, {sabor: "Mussarela", preco: "42.00"}]
    };

    function sync() {
        state.nome = document.getElementById('nome').value;
        state.whats = document.getElementById('whats').value;
        localStorage.setItem('labrio_data', JSON.stringify(state));
        renderPreview();
    }

    function switchTab(tab) {
        document.querySelectorAll('.content-area').forEach(d => d.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function addItem() {
        state.itens.push({sabor: "Novo Item", preco: "0.00"});
        renderList();
        sync();
    }

    function renderList() {
        const container = document.getElementById('item-container');
        container.innerHTML = state.itens.map((it, idx) => `
            <div class="item-row">
                <input type="text" value="${it.sabor}" oninput="state.itens[${idx}].sabor=this.value; sync()" style="flex:2">
                <input type="text" value="${it.preco}" oninput="state.itens[${idx}].preco=this.value; sync()" style="flex:1">
                <button class="btn-del" onclick="state.itens.splice(${idx},1); renderList(); sync()">✕</button>
            </div>
        `).join('');
    }

    function renderPreview() {
        document.getElementById('phone-screen').innerHTML = `
            <div style="background:var(--primary); color:#fff; padding:40px 20px; text-align:center">
                <h1 style="margin:0; font-size:22px">${state.nome}</h1>
            </div>
            <div style="padding:20px; color:#333">
                <h3 style="border-bottom:1px solid #ddd; padding-bottom:10px">🍕 Cardápio</h3>
                ${state.itens.map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:10px"><span>${i.sabor}</span><strong>R$ ${i.preco}</strong></div>`).join('')}
            </div>
            <div style="position:absolute; bottom:30px; width:100%; padding:0 20px">
                <button style="width:100%; background:#25d366; color:#fff; border:none; padding:15px; border-radius:30px; font-weight:bold">Pedir pelo WhatsApp</button>
            </div>
        `;
    }

    // WEBHOOK NOTIFICATION
    function notify(method) {
        const webhookURL = "SUA_WEBHOOK_URL_AQUI"; // Discord/Slack
        const msg = { content: `💰 **Novo Intento de Compra!**\nLoja: ${state.nome}\nMétodo: ${method}\nWhatsApp: ${state.whats}` };
        fetch(webhookURL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(msg) }).catch(() => {});
    }

    function openCheckout() { document.getElementById('modal-pay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal-pay').style.display = 'none'; }

    async function processDownload() {
        const zip = new JSZip();
        zip.file("config.js", `export const CONFIG = ${JSON.stringify(state, null, 4)};`);
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = `site_${state.nome.replace(/\s/g, '_')}.zip`;
        link.click();
        closeModal();
    }

    // Init
    document.getElementById('nome').value = state.nome;
    document.getElementById('whats').value = state.whats;
    renderList();
    renderPreview();
</script>

</body>
</html>
